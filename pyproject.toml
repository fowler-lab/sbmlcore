[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "sbmlcore"
dynamic = ["version"]
description = "Construct core feature tables for structure- and chemistry-based machine learning workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Philip W Fowler" },
    { name = "Charlotte I Lynch" },
    { name = "Dylan Adlard" },
]
keywords = ["bioinformatics", "machine-learning", "protein", "sbml"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "biopython",
    "freesasa",
    "MDAnalysis",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx>=7",
]
test = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Documentation = "https://github.com/fowler-lab/sbmlcore"
CI = "https://github.com/fowler-lab/sbmlcore/actions"
Source = "https://github.com/fowler-lab/sbmlcore"
Tracker = "https://github.com/fowler-lab/sbmlcore/issues"

[tool.setuptools]
packages = ["sbmlcore"]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
sbmlcore = ["data/*.csv"]
