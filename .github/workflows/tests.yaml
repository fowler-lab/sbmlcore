name: Tests
on:
  push:
  pull_request:

jobs:
  build:
    name: Run Python Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-all-dev unzip wget

    - name: Build DSSP
      run: |
        wget https://github.com/cmbi/dssp/archive/refs/tags/2.3.0.zip
        mv 2.3.0.zip dssp-2.3.0.zip
        unzip dssp-2.3.0.zip
        cd dssp-2.3.0
        ./autogen.sh
        ./configure
        make mkdssp
        cp mkdssp ..

    - name: Build STRIDE
      run: |
        wget --no-check-certificate https://webclu.bio.wzw.tum.de/stride/stride.tar.gz
        mkdir stride-src
        mv stride.tar.gz stride-src/
        cd stride-src
        tar zxvf stride.tar.gz
        make
        cp stride ..
        cd ..

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}

    - name: Install MSMS
      shell: bash -l {0}
      run: |
        conda install -y -c bioconda msms
        echo "$CONDA/bin/msms" >> "$GITHUB_PATH"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Test with pytest
      run: |
        pytest --exitfirst --verbose --failed-first --cov=sbmlcore --cov-report=xml
      
